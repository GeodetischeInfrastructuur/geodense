[project]
name = "geodense"
description = "Python library and CLI tool to check density and densify (GeoJSON) geometries using the geodesic (ellipsoidal great-circle) calculation for accurate CRS transformations"
keywords = [
    "coordinate reference system",
    "CRS",
    "densify",
    "geodesic",
    "geojson",
    "great-circle",
    "NSGI",
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
readme = { file = "./README.md", content-type = "text/markdown" }
dependencies = [
    "geojson-pydantic>=2,<3",
    # NSGI pyproj: PROJ compiled with the NSGI-modified proj.db + bundled grids.
    # The version/source are pinned below in [tool.uv.sources]. This build is
    # cp312/linux_x86_64 only, hence requires-python is locked to 3.12. See
    # DOCS.md ("NSGI transformations") and the transformations repo doc
    # "supporting-multiple-python-versions.md" for how to widen this later.
    "pyproj==3.7.2.post1",
    "rich-argparse~=1.3",
    "shapely>=2.0.6,<2.2.0",
]
requires-python = ">=3.12,<3.13"
dynamic = ["version"]

# geodense is distributed as a wheel on the GitHub releases page (not PyPI),
# because it pins the NSGI pyproj wheel which is itself only available there.
# Install/resolve with uv so [tool.uv.sources] below is honoured.
[tool.uv.sources]
pyproj = { url = "https://github.com/GeodetischeInfrastructuur/transformations/releases/download/9.7.1-post1-rc17/pyproj-3.7.2.post1-cp312-cp312-linux_x86_64.whl" }

[dependency-groups]
dev = [
    "prek>=0.3.1",
    "ruff==0.17.2",
    "yamllint>=1.35.1",
    "cli-test-helpers == 4.0.0",
    "coverage==7.6.1",
    "mypy==2.4.0",
    "mypy-extensions==1.0.0",
    "pytest==8.3.2",
    "pytest-env==1.1.3",
    "types-shapely>=2.0.0.20240820",
]


[project.urls]
repository = "https://github.com/GeodetischeInfrastructuur/geodense"


[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.scripts]
geodense = "geodense.main:main"
gden = "geodense.main:main"

[tool.hatch.version]
source = "vcs"

[tool.ruff]

# Exclude a variety of commonly ignored directories.
exclude = [
    "__pypackages__",
    "_build",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git-rewrite",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

line-length = 120

target-version = "py312"

[tool.ruff.lint]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Avoid enforcing line-length violations (`E501`) - fixed by Black
ignore = ["E501", "ISC001"]

# see https://beta.ruff.rs/docs/rules/
select = [
    "E",
    "F",
    "B",
    "ISC",
    "PL",
    "RUF",
    "PT",
    "N",
    "I",
    "C90",
    "W",
    "UP",
    "S",
    "ARG",
    "SIM",
    "Q",
    "ANN",
]

unfixable = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = [
    "E",
    "F",
    "B",
    "ISC",
    "PL",
    "RUF",
    "PT",
    "N",
    "I",
    "C90",
    "W",
    "UP",
    "S",
    "ARG",
    "SIM",
    "Q",
]

# disable rules for tests
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # asserts allowed
    "ANN",  # no type annotation required
]
"util.py" = [
    "S101", # asserts allowed
    "ANN",  # no type annotation required
]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10


[tool.mypy]
plugins = "pydantic.mypy"

warn_return_any = true
warn_unused_configs = true
