name: Generate coverage report
on:
  push:
    branches:
      - main
jobs:
  generate_coverage:
    name: Generate Coverage Report
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Install dependencies
        run: |
          uv sync
      - name: Set env PATH
        run: echo "PATH="$(pwd)/.venv/bin:$PATH"" >> $GITHUB_ENV
      - name: Read Python version
        id: python-version
        run: echo "version=$(cat .python-version)" >> $GITHUB_OUTPUT
      - name: Set env PROJ_DIR
        run: echo "PROJ_DIR="$(pwd)/.venv/lib/python${{ steps.python-version.outputs.version }}/site-packages/pyproj/proj_dir/share/proj"" >> $GITHUB_ENV
      - name: Test with pytest and generate coverage report
        run: |
          coverage run --source=src/geodense -m pytest -v tests
          coverage html -d htmlcov
          coverage json -o htmlcov/coverage.json
          uv run util.py gen-cov-badge htmlcov/coverage.json htmlcov/badge.json
          rm htmlcov/.gitignore
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: htmlcov  # The folder the action should deploy.
          branch: coverage-report
