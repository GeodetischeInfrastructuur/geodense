name: Build and attach wheel to GitHub release
on:
  release:
    types: [published]
permissions:
  contents: write  # required to upload assets to the release
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # to fetch all history for all branches and tags; required because we derive app version from latest tag
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Read Python version
        id: python-version
        run: echo "version=$(cat .python-version)" >> $GITHUB_OUTPUT
      - name: Build package
        run: uv build --wheel --python "${{ steps.python-version.outputs.version }}"
      - name: Attach wheel to GitHub release
        # geodense is distributed via the GitHub releases page, not PyPI,
        # because it depends on NSGI pyproj wheels published there. geodense
        # itself is pure Python, so publish its single universal wheel.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl --clobber
