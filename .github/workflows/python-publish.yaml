name: Build and attach wheel to GitHub release
on:
  release:
    types: [published]
permissions:
  contents: write  # required to upload assets to the release
env:
  PYTHON_VERSION: "3.12"
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # to fetch all history for all branches and tags; required because we derive app version from latest tag
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@v3  # dont specify version, use latest stable version
      - name: Install dependencies
        run: |
          uv sync
      - name: Set env PATH
        run: echo "PATH="$(pwd)/.venv/bin:$PATH"" >> $GITHUB_ENV
      - name: Set env PROJ_DIR
        run: echo "PROJ_DIR="$(pwd)/.venv/lib/python${PYTHON_VERSION}/site-packages/pyproj/proj_dir/share/proj"" >> $GITHUB_ENV
      - name: Build package
        run: uv build --wheel
      - name: Attach wheel to GitHub release
        # geodense is distributed via the GitHub releases page, not PyPI,
        # because it pins the NSGI pyproj wheel which is only published there.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl --clobber
